version: 2.2.0
questions:
  - id: CAL0
    ask: "Chào mừng! Bạn muốn mình giải thích thật kỹ từng bước và lý do (dành cho người mới học thiết kế), hay muốn đi nhanh thẳng vào việc (dành cho người đã quen)?"
    default: "Đi nhanh thẳng vào việc, giải thích tối giản."
    kind: meta
    target_doc: null
    branch: core
    gate: null
    translate_back: "Mình ghi nhận mức độ giải thích: `<giải thích kỹ / đi nhanh>`."
    depends_on: []
    options:
      - { value: deep, label: "Giải thích kỹ", description: "Có thêm lý do và hướng dẫn, nhưng mất thời gian hơn." }
      - { value: fast, label: "Đi nhanh", description: "Tập trung chốt quyết định nhanh với giải thích tối giản." }
    recommendation: { mode: fixed, value: fast }

  - id: S0
    ask: "Nếu kể cho một người bạn trong 10 giây, dự án này là cái gì?"
    default: null
    kind: anchored
    target_doc: 00-vision.md
    branch: core
    gate: null
    translate_back: "Để mình tóm lại thành 1 câu ngắn kiểu elevator pitch: `<bản tóm lại>`. Mình hiểu vậy đúng chưa?"
    depends_on: []
    slot_keys: [vision_elevator_pitch]
    answer_contract:
      required: true
      min_trimmed_chars: 12
      warning_rules:
        - code: S0_GENERIC_PITCH
          pattern: "^(nền tảng|ứng dụng|hệ thống|app)\\s+(kết nối|quản lý|hỗ trợ)\\s+(mọi người|mọi thứ|tất cả)\\.?$"
          message: "Pitch nghe chung chung kiểu \"nền tảng kết nối mọi người\" — thiếu nỗi đau cụ thể, cần mô tả rõ hơn."
  - id: S1
    ask: "Hiện giờ mọi người đang khổ vì chuyện gì, và đang xoay xở kiểu nào khi chưa có sản phẩm này?"
    default: "Suy từ câu S0 rồi đề xuất 1 cách hiểu cụ thể nhất để người dùng xác nhận hoặc sửa."
    kind: anchored
    target_doc: 00-vision.md
    branch: core
    gate: null
    translate_back: "Mình đang hiểu nỗi đau chính là: `<nỗi đau chuẩn hoá>`. Hiện tại họ giải quyết tạm bằng: `<cách xoay xở hiện nay>`. Đúng ý bạn chứ?"
    option_hints:
      synthesize_from: [S0]
      hint_count: 3
      hint_style: "nỗi đau + workaround khả dĩ"
    multi_select: true

    depends_on: [S0]
    slot_keys: [problem_summary, current_workaround]
    answer_contract:
      required: true
      min_trimmed_chars: 8
      warning_rules: []
  - id: S2
    ask: "Kể cho mình 1-2 người sẽ dùng nó đầu tiên. Họ là ai, và họ muốn xong việc gì khi mở sản phẩm ra?"
    default: "Người dùng phổ thông trực tiếp thao tác + 1 vai trò admin hoặc người quản lý nếu dự án có phối hợp nhóm."
    kind: anchored
    target_doc: 01-personas.md
    branch: core
    gate: null
    translate_back: "Mình tóm lại có các nhóm người dùng chính sau: `<persona 1>` muốn `<job-to-be-done 1>`; `<persona 2>` muốn `<job-to-be-done 2>`. Ổn chưa?"
    option_hints:
      synthesize_from: [S0, S1]
      hint_count: 3
      hint_style: "persona + job-to-be-done"
    multi_select: true

    depends_on: [S0, S1]
    slot_keys: [primary_persona_summary, primary_persona_job_to_be_done, secondary_persona_summary, secondary_persona_job_to_be_done]
    answer_contract:
      required: true
      min_trimmed_chars: 10
      warning_rules:
        - code: S2_GENERIC_PERSONA
          pattern: "(ai cũng|mọi người|người dùng phổ thông|tất cả mọi người|anyone|everyone)"
          message: "Persona đang nói \"ai cũng dùng\"/\"người dùng phổ thông\" — cần một nhóm người cụ thể và job-to-be-done rõ ràng."
  - id: S3
    ask: "Cứ kể lộn xộn những việc bạn muốn người dùng làm được trong phiên bản đầu. Không cần tự sắp ưu tiên, mình sẽ giúp nhóm lại."
    default: |
      Must:
      - [Tính năng cốt lõi giải quyết trực tiếp nỗi đau ở S1]
      - [Màn hình xem kết quả/Thống kê đơn giản]
      Should:
      - [Tính năng nâng cao trải nghiệm, thông báo]
      Could:
      - [Tính năng bổ sung khi có thời gian]
      Won't (MVP):
      - [Báo cáo phức tạp, mạng xã hội, automation]
    kind: anchored
    target_doc: 02-scope.md
    branch: core
    gate: scope-locked
    translate_back: "Mình đã nhóm lại thành 4 tầng: Must / Should / Could / Won't. Bản MVP nhỏ nhất mình đề xuất là: `<danh sách Must>`. Phần này để sau là: `<danh sách còn lại>`. Bạn xác nhận giúp mình nhé."
    option_hints:
      synthesize_from: [S0, S1, S2]
      hint_count: 3
      hint_style: "nhóm Must tiêu biểu"

    depends_on: [S0, S1, S2]
    slot_keys: [must_have_scope, should_have_scope, could_have_scope, wont_for_mvp_scope]
    answer_contract:
      required: true
      min_trimmed_chars: 15
      pattern: "must"
      warning_rules:
        - code: S3_EVERYTHING_IS_MUST
          pattern: "(mọi (tính năng|thứ)|tất cả (đều|các tính năng)|toàn bộ (tính năng|danh sách))\\s*(là |đều |)must"
          message: "Có vẻ toàn bộ danh sách đang được xếp vào Must — cần xác nhận đây thật sự là bộ MVP nhỏ nhất, không phải mọi thứ đều bắt buộc."
        - code: S3_MISSING_WONT
          pattern: "^(?:(?!won)[\\s\\S])*$"
          message: "Danh sách chưa thấy phần Won't — xác nhận bạn thật sự chưa muốn loại trừ gì ở MVP này."
  - id: S4
    ask: "Để làm được những việc ở trên, sản phẩm cần nhớ những gì? Cứ kể kiểu đời thường như người dùng, nhóm, khoản chi, ảnh, lịch sử..."
    default: "Suy entity trực tiếp từ nhóm Must; chỉ giữ những thứ có ít nhất một tính năng dùng tới."
    kind: anchored
    target_doc: 03-data-model.md
    branch: core
    gate: null
    translate_back: "Mình tóm lại các dữ liệu lõi là: `<danh sách entity>` cùng quan hệ chính giữa chúng. Mỗi loại dữ liệu này phục vụ trực tiếp cho các tính năng Must. Đúng chứ?"
    option_hints:
      synthesize_from: [S3]
      hint_count: 3
      hint_style: "entity/relationship từ Must"
    multi_select: true

    depends_on: [S0, S1, S2, S3]
    slot_keys: [core_entities, entity_relationships, deferred_data_notes]
    answer_contract:
      required: true
      min_trimmed_chars: 8
      warning_rules: []
  - id: S5
    ask: "Kể thử một lần dùng điển hình từ lúc mở app đến lúc xong việc. Mình chỉ cần một luồng thật nhất thôi."
    default: "Dựng luồng từ tính năng Must quan trọng nhất đã chốt ở S3."
    kind: anchored
    target_doc: 04-flows.md
    branch: core
    gate: null
    translate_back: "Mình viết lại luồng chuẩn như sau: `<các bước mở đến xong việc>`. Luồng này sẽ là ví dụ chính để kiểm tra MVP có thật sự dùng được hay không."
    option_hints:
      synthesize_from: [S3, S4]
      hint_count: 3
      hint_style: "luồng chính từ Must và data"
    multi_select: true

    depends_on: [S0, S1, S2, S3, S4]
    slot_keys: [main_flow_summary, main_flow_steps, main_flow_risks_or_edge_cases]
    answer_contract:
      required: true
      min_trimmed_chars: 12
      warning_rules: []
  - id: S6
    ask: "Bạn làm một mình hay có nhóm, deadline thế nào, ngân sách đến đâu?"
    default: "Solo, không deadline cứng, ưu tiên free-tier."
    kind: anchored
    target_doc: 06-constraints.md
    branch: core
    gate: null
    translate_back: "Mình tóm lại ràng buộc hiện tại là: `<nguồn lực>`, `<deadline>`, `<ngân sách>`. Mình sẽ dùng phần này để giới hạn scope."
    depends_on: [S0, S1, S2, S3, S4, S5]
    slot_keys: [team_and_ownership_constraints, timeline_constraints, budget_constraints, constraint_impact_on_scope]
    answer_contract:
      required: true
      min_trimmed_chars: 6
      warning_rules: []
  - id: S7
    ask: "Hệ thống hỗ trợ các hình-hài dự án sau: Ứng dụng web (web), App di động (mobile), Web + Mobile (hybrid), Công cụ dòng lệnh (cli). Bạn chọn hình-hài nào?"
    default: "web"
    kind: anchored
    target_doc: 06-constraints.md
    branch: core
    gate: null
    translate_back: "Mình xác nhận hình-hài dự án là: `<web / mobile / hybrid / cli>`."
    options:
      - { value: web, label: "Ứng dụng web", description: "Triển khai nhanh và truy cập được từ trình duyệt." }
      - { value: mobile, label: "App di động", description: "Tận dụng trải nghiệm thiết bị nhưng tăng chi phí phát hành." }
      - { value: hybrid, label: "Web và mobile", description: "Phủ hai kênh nhưng cần đồng bộ phạm vi và kiểm thử." }
      - { value: cli, label: "Công cụ dòng lệnh", description: "Hợp tự động hoá kỹ thuật nhưng kém thân thiện với người phổ thông." }
    recommendation: { mode: fixed, value: web }

    depends_on: [S6]
  - id: R1
    ask: "Dự án của bạn có rủi ro hay bất định nào sau đây không: phụ thuộc thư viện/API bên ngoài, chi phí vận hành/tài khoản Store/Cloud, dữ liệu nhạy cảm cần bảo mật, quyền thiết bị phức tạp, hay có phần nào bạn chưa biết cách làm không? (Bạn có thể trả lời 'không biết' hoặc bỏ qua)."
    default: "Không biết/Cần khảo sát thêm."
    kind: anchored
    target_doc: 09-execution-plan.md
    branch: core
    gate: null
    translate_back: "Mình ghi nhận các điểm bất định/rủi ro kỹ thuật cần khảo sát: `<rủi ro của bạn>`. Mình sẽ tự động phân loại chúng thành confirmed (đã xác thực), assumption (giả định), hoặc spike-required (cần nghiên cứu trước)."
    depends_on: [S7]
    answer_contract:
      required: false
      min_trimmed_chars: 0
      warning_rules: []
  - id: S8
    ask: "Một câu nữa trước khi vào phần kỹ thuật, hỏi gộp hai ý: (1) Sản phẩm có giữ dữ liệu gì nhạy cảm không — thông tin cá nhân, thanh toán, sức khỏe, hay nội dung riêng tư của người dùng? (2) Năm đầu bạn hình dung khoảng bao nhiêu người dùng — vài chục người quen, vài trăm, hay hàng nghìn? Cứ đoán, không cần chính xác."
    default: "Không giữ dữ liệu nhạy cảm ngoài thông tin đăng nhập cơ bản; quy mô vài chục tới vài trăm người dùng trong năm đầu."
    kind: anchored
    target_doc: 05-architecture.md
    branch: core
    gate: null
    translate_back: "Mình ghi nhận hai yêu cầu phi chức năng: dữ liệu nhạy cảm gồm `<danh sách hoặc 'không có'>`, và quy mô dự kiến năm đầu khoảng `<số người dùng>`. Hai điều này quyết định mức bảo mật và mức tối ưu **đủ dùng** cho dự án — để không làm thừa (tốn thời gian) mà cũng không làm thiếu (vỡ khi có người dùng thật)."
    depends_on: [R1]
    slot_keys: [data_sensitivity_and_security, expected_scale_and_performance]
    answer_contract:
      required: true
      min_trimmed_chars: 6
      warning_rules: []
  - id: W1
    ask: "Người chưa đăng nhập, thậm chí chưa biết sản phẩm, có cần tìm thấy nội dung này trên Google không? Hay đây gần như là chỗ chỉ dùng sau khi vào tài khoản?"
    default: "Nếu cần người lạ tìm thấy nội dung hoặc trang công khai, ưu tiên SSR/SSG với Next.js. Nếu gần như chỉ dùng sau đăng nhập, ưu tiên SPA để đơn giản hóa."
    kind: anchored
    target_doc: 05-architecture.md
    branch: web
    gate: null
    translate_back: "Mình tóm lại nhu cầu hiển thị là: `<cần SEO / không cần SEO>`, nên hướng rendering phù hợp là `<SSR/SSG hoặc SPA>` vì `<lý do gắn với cách người dùng tìm và dùng sản phẩm>`."
    depends_on: [R1, S8]
    options:
      - { value: public-seo, label: "Công khai cần SEO", description: "Tăng khả năng được tìm thấy nhưng cần rendering phía server." }
      - { value: private-app, label: "Ứng dụng riêng tư", description: "Đơn giản hơn vì phần lớn nội dung sau đăng nhập." }
      - { value: mixed-rendering, label: "Kết hợp hai kiểu", description: "Cân bằng trang công khai và app riêng nhưng tăng độ phức tạp." }
    recommendation: { mode: contextual }

    slot_keys: [client_and_rendering_strategy]
  - id: W2
    ask: "Người dùng của bạn chủ yếu mở sản phẩm trên máy tính, điện thoại, hay lúc nào cũng lẫn cả hai?"
    default: "Cả hai, nên thiết kế responsive và ưu tiên mobile-first ngay từ đầu."
    kind: anchored
    target_doc: 05-architecture.md
    branch: web
    gate: null
    translate_back: "Mình hiểu thiết bị sử dụng chính là `<máy tính / điện thoại / cả hai>`. Vì vậy giao diện nên được thiết kế theo hướng `<responsive mobile-first / desktop-first có lý do cụ thể>`."
    depends_on: [R1, S8, W1]
    options:
      - { value: desktop-first, label: "Ưu tiên máy tính", description: "Tối ưu thao tác màn hình lớn nhưng điện thoại là phụ." }
      - { value: mobile-first, label: "Ưu tiên điện thoại", description: "Tối ưu chạm và màn hình nhỏ nhưng desktop cần thích nghi." }
      - { value: responsive-both, label: "Responsive cả hai", description: "Phục vụ hai thiết bị nhưng cần kiểm thử nhiều breakpoint." }
    recommendation: { mode: fixed, value: responsive-both }

    slot_keys: [client_and_rendering_strategy, architecture_overview]
  - id: W3
    ask: "Bạn muốn người khác có thể mở sản phẩm bằng link ở giai đoạn nào? Có cần tên miền riêng ngay không, hay chỉ cần một bản chạy được để chia sẻ thử trước?"
    default: "Triển khai sớm trên Vercel hoặc Netlify với subdomain miễn phí; chưa cần tên miền riêng ở MVP nếu chưa có nhu cầu thương hiệu hoặc vận hành chính thức."
    kind: anchored
    target_doc: 07-deployment.md
    branch: web
    gate: null
    translate_back: "Mình tóm lại nhu cầu triển khai là: `<chia sẻ bản thử sớm / cần miền riêng ngay / chỉ nội bộ>`. Vì vậy phương án phù hợp trước mắt là `<Vercel hoặc Netlify free + subdomain / phương án khác có lý do>`."
    depends_on: [R1, S8, W1, W2]
    options:
      - { value: preview-subdomain, label: "Subdomain bản thử", description: "Chia sẻ sớm với chi phí thấp nhưng chưa có thương hiệu riêng." }
      - { value: custom-domain, label: "Tên miền riêng", description: "Tạo độ tin cậy sớm nhưng cần vận hành DNS và chi phí." }
      - { value: internal-only, label: "Chỉ nội bộ", description: "Giảm rủi ro công khai nhưng khó lấy phản hồi bên ngoài." }
    recommendation: { mode: fixed, value: preview-subdomain }

    slot_keys: [hosting_strategy, deployment_goal, domain_and_access_strategy]
  - id: W4
    ask: "Người dùng có cần vào bằng tài khoản không? Nếu có thì kiểu nào sẽ đỡ rào cản nhất: email, Google, hay một cách đăng nhập khác?"
    default: "Nếu cần tài khoản, ưu tiên Google OAuth kèm email/password để vừa dễ vào nhanh vừa có đường fallback."
    kind: anchored
    target_doc: 05-architecture.md
    branch: web
    gate: null
    translate_back: "Mình hiểu bài toán truy cập là: `<cần / không cần tài khoản>`. Nếu cần, phương án đăng nhập phù hợp hiện tại là `<Google OAuth + email/password / phương án khác>` vì `<lý do gắn với độ tiện và đối tượng người dùng>`."
    depends_on: [R1, S8, W1, W2, W3]
    options:
      - { value: no-account, label: "Không cần tài khoản", description: "Giảm rào cản vào sản phẩm nhưng hạn chế dữ liệu cá nhân." }
      - { value: google-email, label: "Google và email", description: "Đăng nhập thuận tiện nhưng phải vận hành luồng xác thực." }
      - { value: email-only, label: "Chỉ email", description: "Ít phụ thuộc bên thứ ba nhưng người dùng nhập mật khẩu nhiều hơn." }
    recommendation: { mode: contextual }

    slot_keys: [auth_and_access_strategy]
  - id: W5
    ask: "Có chỗ nào cần cập nhật ngay lúc đó không, kiểu chat, thông báo live, hay nhiều người cùng thấy thay đổi tức thì? Và bạn có cần một khu vực admin riêng để quản lý không?"
    default: "Mặc định chưa cần realtime ở MVP; chỉ thêm trang admin nếu từ S2 đã có vai trò admin hoặc người vận hành rõ ràng."
    kind: anchored
    target_doc: 05-architecture.md
    branch: web
    gate: null
    translate_back: "Mình tóm lại mức tương tác thời gian thực là `<không cần / cần ở chỗ nào>`, và nhu cầu quản trị là `<có / chưa cần admin riêng>`. Vì vậy kiến trúc nên `<giữ đơn giản không realtime / bổ sung realtime có phạm vi rõ>`."
    depends_on: [R1, S8, W1, W2, W3, W4]
    slot_keys: [realtime_push_or_sync_strategy, initial_ops_notes]
    answer_contract:
      required: true
      min_trimmed_chars: 4
      warning_rules:
        - code: W5_REALTIME_REQUESTED
          pattern: "(realtime|thời gian thực|live|đồng bộ tức thì)"
          message: "Bạn vừa yêu cầu realtime — chi phí hạ tầng và độ phức tạp sẽ tăng đáng kể, cần xác nhận đã cân nhắc đánh đổi này."
  - id: M1
