version: 1.0.0
# B3c — Authoritative machine-readable artifact catalog.
# Single source for exact output path/tier/shape/ownership. CLI/adapter/tests
# read counts and paths from here via compileRuntimeCatalog(), never from a
# hand-copied literal list. `shapes: [core]` means "every shape"; a shape id
# (web/mobile/hybrid/cli) restricts the artifact to that shape only.
artifacts:
  - id: doc-00-vision
    path: docs/00-vision.md
    tier: 1
    shapes: [core]
    required: true
    ownership: managed
    kind: doc
    media_type: text/markdown
    source:
      question_ids: [S0, S1]
      recipe_ids: []

